<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TAZ Admin</title>
  <link rel="shortcut icon" href="../img/logo-red.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./panel.css">
</head>
<body>
  <nav class="rail" aria-label="Secciones">
    <div class="logo">TAZ</div>
    <button class="on" data-view="inicio">Inicio</button>
    <button data-view="stats">Estadísticas</button>
    <button data-view="team">Empleados</button>
    <button class="out" id="logout">Salir</button>
  </nav>

  <main>
    <!-- INICIO -->
    <section id="inicio" class="view on">
      <div class="bar">
        <h1>Ingresos</h1>
        <button class="btn red" id="newRec">Nuevo registro</button>
      </div>

      <div class="kpis" id="kpis"></div>

      <section class="block">
        <div class="head">
          <h2>Totales por local</h2>
          <div class="tools"><label>Día<input type="date" id="dayPick"></label></div>
        </div>
        <div class="scroll" id="branchTbl"></div>
      </section>

      <section class="block">
        <div class="head">
          <h2>Evolución de ingresos</h2>
          <div class="tools">
            <label>Desde<input type="date" id="trFrom"></label>
            <label>Hasta<input type="date" id="trTo"></label>
          </div>
        </div>
        <div class="plot"><canvas id="trendChart"></canvas></div>
      </section>

      <section class="block">
        <div class="head">
          <h2>Historial de registros</h2>
          <div class="tools">
            <label>Desde<input type="date" id="recFrom"></label>
            <label>Hasta<input type="date" id="recTo"></label>
            <label>Sucursal<select id="recBranch"></select></label>
          </div>
        </div>
        <div class="scroll" id="recTbl"></div>
        <p class="foot" id="recSum"></p>
      </section>
    </section>

    <!-- ESTADÍSTICAS -->
    <section id="stats" class="view">
      <div class="bar"><h1>Estadísticas</h1></div>
      <div class="chips" id="scopeChips"></div>

      <div class="head" style="margin-top:18px">
        <div class="chips" id="rangeChips">
          <button data-days="7">7 días</button>
          <button data-days="14">14 días</button>
          <button class="on" data-days="30">30 días</button>
          <button data-days="90">90 días</button>
        </div>
        <div class="tools">
          <label>Desde<input type="date" id="stFrom"></label>
          <label>Hasta<input type="date" id="stTo"></label>
        </div>
      </div>

      <div class="kpis" id="stKpis"></div>

      <section class="block">
        <div class="head"><h2 id="stTitle">Ingresos por día</h2></div>
        <div class="plot"><canvas id="statsChart"></canvas></div>
      </section>

      <section class="block split">
        <div>
          <div class="head"><h2>Por medio de pago</h2></div>
          <ul class="bars" id="mixList"></ul>
        </div>
        <div>
          <div class="head"><h2>Por semana</h2></div>
          <div class="scroll" id="weekTbl"></div>
        </div>
      </section>

      <section class="block">
        <div class="head"><h2>Registros del período</h2></div>
        <div class="scroll" id="stTbl"></div>
        <p class="foot" id="stSum"></p>
      </section>
    </section>

    <!-- EMPLEADOS -->
    <section id="team" class="view">
      <div class="bar"><h1>Empleados</h1></div>
      <div class="team">
        <form id="empForm" class="form">
          <h2 id="empTitle">Agregar empleado</h2>
          <input type="hidden" id="eId">
          <div class="two">
            <label>Nombre<input id="eName" required></label>
            <label>Apellido<input id="eLast" required></label>
          </div>
          <div class="two">
            <label>Rol
              <select id="eRole"><option>Empleado</option><option>Encargado</option></select>
            </label>
            <label>Cobro por hora<input id="eRate" type="number" min="0" step="0.01" value="0"></label>
          </div>
          <div class="two">
            <label>Teléfono<input id="ePhone" type="tel" required></label>
            <label>Sucursal<select id="eBranch"></select></label>
          </div>
          <label id="ePassWrap" hidden><span id="ePassLabel">Contraseña del encargado</span><input id="ePass" type="password" autocomplete="new-password"></label>
          <label>Notas<textarea id="eNotes" rows="3"></textarea></label>
          <div class="acts">
            <button class="btn red" type="submit">Guardar empleado</button>
            <button class="btn" type="button" id="eCancel">Cancelar</button>
          </div>
        </form>
        <div id="empList"></div>
      </div>
    </section>
  </main>

  <!-- Hoja para crear y editar registros -->
  <aside class="sheet" id="sheet" aria-labelledby="sheetTitle" aria-hidden="true">
    <header>
      <div><h2 id="sheetTitle">Editar registro</h2><p id="sheetWho"></p></div>
      <button class="btn sm" type="button" id="sheetClose" aria-label="Cerrar">Cerrar</button>
    </header>
    <form id="recForm" class="form" autocomplete="off">
      <div class="two">
        <label>Fecha<input type="date" id="fFecha" required></label>
        <label>Hora<input type="time" id="fHora" required></label>
      </div>
      <label>Sucursal<select id="fSuc"></select></label>
      <div class="money" id="moneyFields"></div>
      <label>Notas del día<textarea id="fNotas" rows="3"></textarea></label>
      <label>Stock / faltantes<textarea id="fStock" rows="3"></textarea></label>
      <label class="check"><input type="checkbox" id="fZ"><span>No sumar a los totales (estado Z)<small>El registro se conserva y se muestra, pero queda fuera de promedios y totales.</small></span></label>
    </form>
    <footer>
      <div class="tot"><span id="fTotLabel">Total del registro</span><b class="num" id="fTotal">$0</b></div>
      <button class="btn" type="button" id="sheetCancel">Cancelar</button>
      <button class="btn red" type="submit" form="recForm" id="sheetSave">Guardar cambios</button>
    </footer>
  </aside>
  <div class="veil" id="veil"></div>

  <div id="tip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./ui.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
