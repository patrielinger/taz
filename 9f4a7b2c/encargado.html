<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TAZ Encargado</title>
  <link rel="shortcut icon" href="../img/logo-red.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./panel.css">
</head>
<body class="solo">
  <main>
    <div class="bar">
      <div>
        <h1>Cierre del día</h1>
        <p class="hint" id="who" style="margin:4px 0 0"></p>
      </div>
      <button class="btn" id="logout" type="button">Salir</button>
    </div>

    <form id="encForm" class="form" autocomplete="off">
      <div class="two">
        <label>Fecha<input type="date" id="eFecha" required></label>
        <label>Hora<input type="time" id="eHora" required></label>
      </div>
      <label>Sucursal<select id="eSuc"></select></label>

      <div class="two" id="moneyFields"></div>

      <label>Notas y novedades<textarea id="eNotas" rows="3" placeholder="Novedades del día"></textarea></label>
      <label>Stock / faltantes<textarea id="eStock" rows="3" placeholder="Ej: Nuggets, Gaseosa 1L"></textarea></label>

      <div class="bar" style="margin:6px 0 0">
        <div><span class="hint">Total cobrado</span><br><b class="num" id="eTotal" style="font-size:34px">$0</b></div>
        <button class="btn red" type="submit" id="send">Enviar registro</button>
      </div>
    </form>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./ui.js"></script>
  <script src="./encargado.js"></script>
</body>
</html>
