services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taz_app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: taz_admin
      SESSION_SECRET: taz_super_secret
      PORT: 3000

    ports:
      - "3000:3000"

    command: npm run dev

  db:
    image: mysql:8.0
    container_name: taz_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: taz_admin
      MYSQL_USER: tazuser
      MYSQL_PASSWORD: password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  mysql_data: