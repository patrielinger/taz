services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: taz_admin
      SESSION_SECRET: taz_super_secret
      PORT: 3000

    expose:
      - "3000"

    volumes:
      - taz_uploads:/app/uploads

  db:
    image: mysql:8.0

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: taz_admin
      MYSQL_USER: tazuser
      MYSQL_PASSWORD: password

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-ppassword"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  taz_uploads: